sensors:
  zph:
    enabled: false
  light:
    enabled: false
  microphone:
    enabled: true
    device_index: 1          # auto-detect PC mic
    output_device_index: 2   # default PC output

processors:
  audio_comfort:
    enabled: true
    check_duration: 10
    comfort_duration: 300
    tolerance_threshold: 45.0
    critical_threshold: 55.0

actuators:
  neopixel:
    enabled: false
  shelly:
    enabled: false
    devices:
      - name: "Lampada1 Uff Sensorizzato"
        ip: "192.168.1.191"
        enabled: true

communicator:
  telegraf:
    enabled: false
  ipc:
    method: "sqlite"
    db_path: null

web:
  enabled: true
  host: "127.0.0.1"
  port: 5000

logging:
  level: "INFO"
