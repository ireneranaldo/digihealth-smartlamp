<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfort Audio Control</title>
    <style>
        :root {
            --bg-idle:     #f2e8db;
            --bg-check:    #f8e4c6;
            --bg-comfort:  #f6dcc8;
            --accent-green:  #8a7f7d;
            --accent-yellow: #d8a47f;
            --accent-red:    #e49571;
            --accent-zen:    #ca8e7b;
            --text-light:    #4d3c2f;
            --panel-shadow:  rgba(80,48,32,0.25);
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg-idle);
            color: var(--text-light);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 6px;
            overflow: hidden;
            height: 100vh; width: 100vw;
            transition: background 0.8s ease;
        }
        .container {
            display: flex; flex-direction: column;
            height: 98vh; gap: 8px;
        }

        /* ---- TOP PANEL ---- */
        .top-panel {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr 0.9fr 1.4fr 0.8fr 0.6fr 0.6fr;
            gap: 8px;
            background: linear-gradient(140deg, #fdf0e0, #f5dcc4);
            box-shadow: 0 8px 20px var(--panel-shadow);
            padding: 12px 16px;
            border-radius: 20px;
            align-items: center;
            border: 1px solid rgba(208,170,132,0.4);
        }
        .mode-block { display: flex; flex-direction: column; gap: 2px; }
        #mode-text  { font-size: 1.15rem; font-weight: bold; color: var(--accent-yellow); }
        #mode-sub   { font-size: 0.75rem; color: #999; }

        .db-block   { text-align: center; }
        #db-display { font-size: 2.6rem; font-weight: bold; line-height: 1; }
        .unit       { font-size: 0.9rem; color: #999; }

        .threshold-block { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; }
        .th-row { display: flex; justify-content: space-between; gap: 8px; }
        .th-label { color: #aaa; }
        .th-val { font-weight: 700; }
        #th-tol-val  { color: var(--accent-yellow); }
        #th-crit-val { color: var(--accent-red); }

        .btn {
            padding: 11px 16px;
            font-size: 0.95rem; font-weight: 700;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
            color: white;
        }
        .btn:hover   { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(0,0,0,0.3); }
        .btn:active  { transform: translateY(0); }
        .btn-cal     { background: #3498db; }
        .btn-cal:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-toggle-off { background: #7cb97c; }
        .btn-toggle-on  { background: var(--accent-red); }
        .btn-exit {
            background: rgba(255,255,255,0.18);
            color: rgba(97,76,67,0.85);
            border: 1px solid rgba(123,85,72,0.25);
            font-size: 0.78rem; padding: 8px 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            opacity: 0.55;
        }
        .btn-exit:hover { opacity: 0.9; }

        .audio-block { display: flex; flex-direction: column; gap: 5px; font-size: 0.78rem; }
        .audio-block label { color: #aaa; font-size: 0.72rem; }
        .audio-toggle { display: flex; gap: 6px; }
        .audio-toggle button {
            flex: 1; padding: 4px 6px; border-radius: 20px; border: 1px solid rgba(202,142,123,0.4);
            background: rgba(255,255,255,0.3); color: var(--text-light);
            font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
        }
        .audio-toggle button.active { background: var(--accent-zen); color: white; border-color: transparent; }
        #audio-file-select {
            width: 100%; padding: 3px 6px; border-radius: 8px;
            border: 1px solid rgba(202,142,123,0.4);
            background: rgba(255,255,255,0.4); color: var(--text-light);
            font-size: 0.72rem; display: none;
        }
        #audio-file-select.visible { display: block; }
        .volume-block label { font-size: 0.75rem; color: var(--text-light); }
        .volume-slider {
            width: 70px; height: 5px;
            border-radius: 3px;
            background: rgba(255,255,255,0.35);
            outline: none; -webkit-appearance: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 15px; height: 15px;
            border-radius: 50%; background: var(--accent-zen);
            cursor: pointer; box-shadow: 0 1px 5px rgba(0,0,0,0.25);
        }
        .volume-slider::-moz-range-thumb {
            width: 15px; height: 15px; border-radius: 50%;
            background: var(--accent-zen); cursor: pointer; border: none;
        }

        /* ---- TIMER + DB BAR ---- */
        .meter-panel {
            display: flex; align-items: center; gap: 12px;
            padding: 0 4px;
        }
        #timer-val { font-size: 1.8rem; font-weight: bold; font-family: monospace; min-width: 70px; }
        #db-container {
            flex: 1; height: 18px;
            background: rgba(0,0,0,0.08);
            border-radius: 9px; overflow: hidden;
            border: 1px solid rgba(117,95,77,0.3);
        }
        #db-bar { width: 0%; height: 100%; background: var(--accent-green); transition: width 0.12s; border-radius: 9px; }

        /* ---- AIR QUALITY ROW ---- */
        .air-quality-row {
            display: flex; justify-content: space-around;
            font-weight: bold; font-size: 0.9rem;
        }
        .air-quality-row span {
            background: rgba(255,255,255,0.4);
            padding: 2px 10px; border-radius: 6px;
            min-width: 44px; display: inline-block; text-align: center;
        }

        /* ---- SPECTRUM CANVAS ---- */
        #spectrum-wrap {
            flex: 1;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(0,0,0,0.07);
        }
        #spectrum-canvas {
            width: 100%; height: 100%;
            display: block;
        }
        #spectrum-overlay {
            position: absolute; top: 8px; left: 14px;
            font-size: 0.72rem; color: rgba(77,60,47,0.5);
            pointer-events: none;
        }
        /* soglie orizzontali etichette */
        #label-tol, #label-crit {
            position: absolute; right: 10px;
            font-size: 0.68rem; font-weight: 700;
            pointer-events: none;
        }
        #label-tol  { color: rgba(216,164,127,0.8); }
        #label-crit { color: rgba(228,149,113,0.9); }

        /* ---- CALIBRATING OVERLAY ---- */
        #cal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(242,232,219,0.88);
            z-index: 100;
            flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px;
        }
        #cal-overlay.visible { display: flex; }
        #cal-title  { font-size: 1.5rem; font-weight: bold; color: var(--accent-yellow); }
        #cal-ring-wrap { position: relative; width: 100px; height: 100px; }
        #cal-ring {
            width: 100px; height: 100px;
            border: 6px solid rgba(202,142,123,0.2);
            border-top-color: var(--accent-zen);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        #cal-secs {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; font-weight: bold; font-family: monospace;
        }
        #cal-db-live {
            font-size: 2.2rem; font-weight: bold;
        }
        #cal-hint { font-size: 0.85rem; color: #aaa; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body id="main-body">

<!-- CALIBRATION OVERLAY -->
<div id="cal-overlay">
    <div id="cal-title">CALIBRAZIONE IN CORSO</div>
    <div id="cal-ring-wrap">
        <div id="cal-ring"></div>
        <div id="cal-secs">10</div>
    </div>
    <div id="cal-db-live">-- dB</div>
    <div id="cal-hint">Stai in silenzio — misuro il rumore di fondo</div>
</div>

<div class="container">

    <!-- TOP PANEL -->
    <div class="top-panel">
        <div class="mode-block">
            <div id="mode-text">IDLE</div>
            <div id="mode-sub">Sistema fermo</div>
        </div>

        <div class="db-block">
            <div id="db-display"><span id="db-val">0</span><span class="unit"> dB</span></div>
        </div>

        <div class="threshold-block">
            <div class="th-row"><span class="th-label">Soglia comfort</span><span class="th-val" id="th-tol-val">45 dB</span></div>
            <div class="th-row"><span class="th-label">Soglia critica</span><span class="th-val" id="th-crit-val">65 dB</span></div>
        </div>

        <button id="calBtn"  class="btn btn-cal" onclick="runCalibration()">Calibra</button>
        <button id="mainBtn" class="btn btn-toggle-off" onclick="toggle()">Avvia</button>

        <div class="audio-block">
            <label>Modalità comfort</label>
            <div class="audio-toggle">
                <button id="btn-noise" class="active" onclick="setComfortMode('white_noise')">⬜ Rumore</button>
                <button id="btn-file"  onclick="setComfortMode('file')">🎵 File</button>
            </div>
            <select id="audio-file-select" onchange="setAudioFile(this.value)">
                <option value="">— scegli file —</option>
            </select>
        </div>

        <div class="volume-block">
            <label for="volume-slider">Volume</label>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.5">
        </div>

        <button class="btn btn-exit" onclick="exitApp()">Esci</button>
    </div>

    <!-- METER -->
    <div class="meter-panel">
        <div id="timer-val">00:00</div>
        <div id="db-container"><div id="db-bar"></div></div>
    </div>

    <!-- AIR QUALITY -->
    <div class="air-quality-row">
        <div>T: <span id="temp-val">--</span> °C</div>
        <div>U: <span id="hum-val">--</span> %</div>
        <div>CO2: <span id="co2-val">--</span></div>
        <div>IAQI: <span id="iaqi-val">--</span></div>
    </div>

    <!-- SPECTRUM -->
    <div id="spectrum-wrap">
        <canvas id="spectrum-canvas"></canvas>
        <div id="spectrum-overlay">SPETTRO FREQUENZE</div>
        <div id="label-tol">tol</div>
        <div id="label-crit">crit</div>
    </div>

</div>

<script>
// -----------------------------------------------------------------------
// Canvas spectrum renderer — nessuna libreria esterna necessaria
// -----------------------------------------------------------------------
const canvas  = document.getElementById('spectrum-canvas');
const ctx     = canvas.getContext('2d');
let currentBg = '#f2e8db';
let thTol     = 45;
let thCrit    = 65;

const FREQ_LABELS = [
    '40', '', '', '', '',
    '200', '', '', '', '',
    '1k', '', '', '', '',
    '4k', '', '', '', '',
    '16k', '', '', '', '',
    '', '', '', '', '',
    '', '', '', '', '',
    '', '', '', '', '',
    '', '', '', '', '',
    '', '', '', '', '',
    '', '', '', ''
];

function resizeCanvas() {
    const wrap = document.getElementById('spectrum-wrap');
    canvas.width  = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function barColor(val, peak) {
    if (peak)       return 'rgba(228,149,113,0.9)';
    if (val > 75)   return '#e49571';
    if (val > 45)   return '#d8a47f';
    return '#8fbfae';
}

// Peak-hold per ogni barra
const peakHold    = new Array(48).fill(0);
const peakDecay   = new Array(48).fill(0);
const PEAK_FRAMES = 18;

function drawSpectrum(spectrum) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const n    = spectrum.length || 48;
    const gap  = 2;
    const barW = Math.max(2, (W - gap * (n + 1)) / n);

    // Linee soglia
    const yTol  = H - (thTol / 100)  * H;
    const yCrit = H - (thCrit / 100) * H;

    // tol line
    ctx.strokeStyle = 'rgba(216,164,127,0.45)';
    ctx.lineWidth   = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(0, yTol);  ctx.lineTo(W, yTol);  ctx.stroke();
    ctx.setLineDash([]);

    // crit line
    ctx.strokeStyle = 'rgba(228,149,113,0.8)';
    ctx.lineWidth   = 1.5;
    ctx.beginPath(); ctx.moveTo(0, yCrit); ctx.lineTo(W, yCrit); ctx.stroke();

    // Posiziona etichette soglia
    document.getElementById('label-tol').style.top  = Math.max(4,  yTol  - 14) + 'px';
    document.getElementById('label-crit').style.top = Math.max(4, yCrit - 14) + 'px';

    for (let i = 0; i < n; i++) {
        const val  = Math.min(100, spectrum[i] || 0);
        const x    = gap + i * (barW + gap);
        const barH = (val / 100) * (H - 20);
        const y    = H - barH;

        // Aggiorna peak hold
        if (val >= peakHold[i]) {
            peakHold[i]  = val;
            peakDecay[i] = PEAK_FRAMES;
        } else {
            if (peakDecay[i] > 0) peakDecay[i]--;
            else peakHold[i] = Math.max(0, peakHold[i] - 1.5);
        }

        // Gradiente barra
        const grad = ctx.createLinearGradient(x, y, x, H);
        if (val > 75) {
            grad.addColorStop(0, 'rgba(228,100,71,0.9)');
            grad.addColorStop(1, 'rgba(228,149,113,0.5)');
        } else if (val > 45) {
            grad.addColorStop(0, 'rgba(216,164,127,0.9)');
            grad.addColorStop(1, 'rgba(216,164,127,0.4)');
        } else {
            grad.addColorStop(0, 'rgba(100,180,155,0.85)');
            grad.addColorStop(1, 'rgba(100,180,155,0.25)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x, y, barW, barH, [3, 3, 0, 0]);
        ctx.fill();

        // Etichetta frequenza
        if (FREQ_LABELS[i]) {
            ctx.fillStyle = 'rgba(77,60,47,0.4)';
            ctx.font      = '9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(FREQ_LABELS[i], x + barW / 2, H - 2);
        }

        // Peak dot
        const peakH = (peakHold[i] / 100) * (H - 20);
        const peakY = H - peakH - 2;
        if (peakHold[i] > 2) {
            ctx.fillStyle = 'rgba(228,100,71,0.7)';
            ctx.fillRect(x, peakY, barW, 2);
        }
    }
}

// -----------------------------------------------------------------------
// Calibrazione countdown lato client
// -----------------------------------------------------------------------
let calTimer = null;

function runCalibration() {
    const btn    = document.getElementById('calBtn');
    const overlay= document.getElementById('cal-overlay');
    const secsEl = document.getElementById('cal-secs');
    const dbLive = document.getElementById('cal-db-live');

    btn.disabled = true;
    overlay.classList.add('visible');

    // Countdown visivo 10→0
    let secs = 10;
    secsEl.innerText = secs;
    if (calTimer) clearInterval(calTimer);
    calTimer = setInterval(() => {
        secs = Math.max(0, secs - 1);
        secsEl.innerText = secs;
    }, 1000);

    function closeOverlay() {
        clearInterval(calTimer);
        calTimer = null;
        overlay.classList.remove('visible');
        btn.disabled = false;
    }

    // Timeout di sicurezza: se dopo 20s non arriva nulla sblocca
    const safetyTimeout = setTimeout(() => {
        closeOverlay();
    }, 20000);

    fetch('/calibrate')
        .then(() => {
            // Inizia il polling dopo 2s (tempo per avviare la calibrazione)
            setTimeout(() => {
                const poll = setInterval(() => {
                    fetch('/calibrate/result')
                        .then(r => r.json())
                        .then(data => {
                            // Aggiorna dB live nell'overlay
                            dbLive.innerText = (state_level || '--') + ' dB';

                            if (data.status === 'running' || data.status === 'idle') return;
                            clearInterval(poll);
                            clearTimeout(safetyTimeout);
                            closeOverlay();
                            if (data.error) {
                                alert('Errore: ' + data.error);
                            } else {
                                thTol  = data.new_tol;
                                thCrit = data.new_crit;
                                alert(`Calibrazione completata!\nRumore di fondo: ${data.avg} dB\nSoglia comfort: ${data.new_tol} dB\nSoglia critica: ${data.new_crit} dB`);
                            }
                        }).catch(() => {});
                }, 500);
            }, 2000);
        })
        .catch(() => {
            clearTimeout(safetyTimeout);
            closeOverlay();
            alert('Errore di connessione durante la calibrazione.');
        });
}

function setComfortMode(mode) {
    fetch('/set_comfort_mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode })
    }).catch(() => {});
    document.getElementById('btn-noise').classList.toggle('active', mode === 'white_noise');
    document.getElementById('btn-file').classList.toggle('active',  mode === 'file');
    const sel = document.getElementById('audio-file-select');
    sel.classList.toggle('visible', mode === 'file');
    if (mode === 'file') loadAudioFiles();
}

function setAudioFile(filename) {
    if (!filename) return;
    fetch('/set_audio_file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename })
    }).catch(() => {});
}

function loadAudioFiles() {
    fetch('/audio_files')
        .then(r => r.json())
        .then(data => {
            const sel = document.getElementById('audio-file-select');
            const current = sel.value;
            sel.innerHTML = '<option value="">— scegli file —</option>';
            (data.files || []).forEach(f => {
                const opt = document.createElement('option');
                opt.value = f; opt.textContent = f;
                if (f === current) opt.selected = true;
                sel.appendChild(opt);
            });
            if (!data.files || data.files.length === 0) {
                sel.innerHTML = '<option value="">Nessun file in /audio/</option>';
            }
        }).catch(() => {});
}

function toggle() {
    fetch('/toggle').catch(() => {});
}

document.getElementById('volume-slider').addEventListener('input', function () {
    fetch('/set_volume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ volume: parseFloat(this.value) })
    }).catch(() => {});
});

function exitApp() {
    fetch('/shutdown_kiosk').catch(() => {});
}

// -----------------------------------------------------------------------
// Refresh loop 4 volte al secondo
// -----------------------------------------------------------------------
function refresh() {
    fetch('/status')
        .then(r => r.json())
        .then(data => {
            const body    = document.getElementById('main-body');
            const modeTxt = document.getElementById('mode-text');
            const modeSub = document.getElementById('mode-sub');
            const timerEl = document.getElementById('timer-val');
            const btn     = document.getElementById('mainBtn');

            // Aggiorna soglie locali
            thTol  = data.th_tol;
            thCrit = data.th_crit;
            document.getElementById('th-tol-val').innerText  = thTol  + ' dB';
            document.getElementById('th-crit-val').innerText = thCrit + ' dB';

            // Stato / modalità
            if (!data.active) {
                currentBg = 'var(--bg-idle)';
                modeTxt.innerText   = 'SISTEMA IDLE';
                modeTxt.style.color = '#aaa';
                modeSub.innerText   = 'Pronto per avvio';
                timerEl.innerText   = '00:00';
                btn.innerText       = 'Avvia';
                btn.className       = 'btn btn-toggle-off';
            } else if (data.mode === 'CALIBRATING') {
                currentBg = 'var(--bg-idle)';
                modeTxt.innerText   = 'CALIBRAZIONE';
                modeTxt.style.color = '#3498db';
                modeSub.innerText   = 'Ascolto rumore di fondo…';
            } else if (data.mode === 'CHECK') {
                currentBg = 'var(--bg-check)';
                modeTxt.innerText   = 'ANALISI AMBIENTE';
                modeTxt.style.color = 'var(--accent-yellow)';
                modeSub.innerText   = 'Monitoraggio attivo';
                btn.innerText       = 'Ferma';
                btn.className       = 'btn btn-toggle-on';
                const m = Math.floor(data.countdown / 60);
                const s = data.countdown % 60;
                timerEl.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            } else if (data.mode === 'COMFORT') {
                currentBg = 'var(--bg-comfort)';
                modeTxt.innerText   = 'MODALITÀ COMFORT';
                modeTxt.style.color = 'var(--accent-red)';
                modeSub.innerText   = 'Rumore bianco attivo';
                btn.innerText       = 'Ferma';
                btn.className       = 'btn btn-toggle-on';
                const m = Math.floor(data.countdown / 60);
                const s = data.countdown % 60;
                timerEl.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }

            body.style.background = currentBg;

            // dB display + barra
            const db  = data.level || 0;
            document.getElementById('db-val').innerText = db.toFixed ? db.toFixed(1) : db;
            const pct = Math.min(db, 100);
            const bar = document.getElementById('db-bar');
            bar.style.width = pct + '%';
            bar.style.background = db >= thCrit ? '#e49571' : db >= thTol ? '#d8a47f' : '#8fbfae';

            // Volume slider sync
            document.getElementById('volume-slider').value = data.volume;

            // Aggiorna spettro canvas
            drawSpectrum(data.spectrum || []);

            // Qualità aria
            if (data.air_quality) {
                const a = data.air_quality;
                document.getElementById('temp-val').innerText = a.temp     ?? '--';
                document.getElementById('hum-val').innerText  = a.humidity ?? '--';
                document.getElementById('co2-val').innerText  = a.co2      ?? '--';
                const iEl = document.getElementById('iaqi-val');
                iEl.innerText   = a.iaqi ?? '--';
                iEl.style.color = a.iaqi > 100 ? 'var(--accent-red)'
                                : a.iaqi > 50  ? 'var(--accent-yellow)'
                                : 'inherit';
            }

            // Aggiorna anche il live-dB nell'overlay calibrazione se visibile
            document.getElementById('cal-db-live').innerText = db.toFixed ? db.toFixed(1) + ' dB' : db + ' dB';
        })
        .catch(() => {});
}

setInterval(refresh, 250);
refresh();
</script>
</body>
</html>
